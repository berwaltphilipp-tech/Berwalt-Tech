---
# Leiste ganz oben. Alle Optionen: https://gethomepage.dev/widgets/

- glances:
    url: "{{HOMEPAGE_VAR_GLANCES_URL}}"
    version: 4
    label: Server
    cpu: true
    mem: true
    cputemp: true
    uptime: true
    # Kein "disk" hier: das wäre nur die ~100-GB-Systempartition von Proxmox.
    # Alle Speicher stehen in den Kacheln "Speicher frei/belegt".
    expanded: true

- datetime:
    text_size: xl
    locale: de-DE
    format:
      dateStyle: full
      timeStyle: short
      hourCycle: h23

- search:
    provider: duckduckgo
    target: _blank
